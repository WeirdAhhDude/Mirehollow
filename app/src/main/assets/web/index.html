<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mirehollow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="joyZone"></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="bubbles"></div>

    <div id="hud">
      <div class="hl">
        <div class="pill clock"><b id="hudTime">--:--</b><span id="hudDay"></span></div>
        <div class="pill place" id="hudPlace"></div>
        <div id="hpBar" class="pill hp"><span>❤️</span><div class="bar"><i></i></div><b>100</b></div>
        <div id="party"></div>
        <button id="jobPill" class="pill job hidden"></button>
      </div>
      <div class="hr">
        <div class="pill" id="hudCoins"></div>
        <span id="hudAi" class="aidot" title=""></span>
        <button id="btnPhone" class="hb hidden" title="Phone">📱<span class="badge"></span></button>
        <button id="btnJournal" class="hb" title="Journal (J)">📖</button>
        <button id="btnLog" class="hb" title="Chat log (L)">💬</button>
        <button id="btnMenu" class="hb" title="Menu (Esc)">⚙️</button>
      </div>
    </div>

    <div id="jobArrow">➤</div>
    <div id="vibe"></div>
    <div id="narr"></div>
    <div id="toasts"></div>
    <button id="btnA" aria-label="Interact"><span class="dot">A</span><span id="btnALabel"></span></button>

    <div id="chat" class="hidden">
      <div id="cast"></div>
      <div id="castShelf"></div>
      <div id="castTags"></div>
      <div id="says"></div>
      <div id="meBubble"></div>
      <button id="chatLogTop" title="Conversation log">📜 Log</button>
      <div id="chatbar">
        <div id="quick">
          <button id="btnWait" class="qb" title="Stay quiet and let them talk">… Listen</button>
          <button id="btnChatLog" class="qb" title="Chat log">📜 Log</button>
          <button id="btnInvite" class="qb" title="Invite someone over or to meet somewhere">🏠 Invite</button>
          <button id="btnGive" class="qb" title="Give something">🎁 Give</button>
          <button id="btnPlay" class="qb" title="Play a game">🎲 Play</button>
          <button id="btnFight" class="qb" title="Spar or fight">⚔️ Fight</button>
          <button id="btnStar" class="qb" title="Insert an *action*">✱ Action</button>
          <button data-act="*waves*">👋</button>
          <button data-act="*hugs*">🤗</button>
          <button data-act="*offers a handshake*">🤝</button>
          <button data-act="*smiles*">😊</button>
          <button data-act="*laughs*">😂</button>
          <button data-act="*winks*">😉</button>
          <button data-act="*bows politely*">🙇</button>
        </div>
        <div id="toChip"></div>
        <div class="row">
          <button id="btnLeave" class="cb" title="Leave the conversation">✕</button>
          <input id="chatInput" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" maxlength="400" placeholder="Say something… *actions* in asterisks">
          <button id="btnSend" class="cb send" title="Send">➤</button>
        </div>
      </div>
    </div>

    <div id="logPanel"><header><span>Chat log</span><button id="logClose" class="cb">✕</button></header><div id="logList"></div></div>
    <div id="modals"></div>
    <div id="fade"></div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/data_chars.js"></script>
  <script src="js/data_folk.js"></script>
  <script src="js/data_lore.js"></script>
  <script src="js/world.js"></script>
  <script src="js/art.js"></script>
  <script src="js/social.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/input.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/games.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/fight.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
